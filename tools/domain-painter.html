<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>里昂车站 -2 层 · 域标记工具</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #16181d; color: #e8e8ea;
    font: 13px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: #1f232b; border-bottom: 1px solid #333a45;
    user-select: none;
  }
  #toolbar .sep { color: #4a5261; }
  button {
    background: #2a303b; color: #e8e8ea; border: 1px solid #3d4552;
    border-radius: 6px; padding: 5px 12px; font: inherit; cursor: pointer;
  }
  button:hover { background: #343c49; }
  button.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  button.color-btn::before {
    content: ""; display: inline-block; width: 11px; height: 11px;
    border-radius: 3px; margin-right: 6px; vertical-align: -1px;
    background: var(--sw);
  }
  #stage { position: relative; flex: 1; overflow: hidden; background: #101216; }
  #view { position: absolute; inset: 0; touch-action: none; }
  #hint {
    padding: 7px 12px; background: #1f232b; border-top: 1px solid #333a45;
    color: #9aa3b2; font-size: 12px;
  }
  #hint b { color: #e8e8ea; }
  #status { margin-left: auto; color: #8ec07c; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="toolbar">
  <span>域：</span>
  <button class="color-btn active" data-domain="free"  style="--sw:#f59e0b">免费域</button>
  <button class="color-btn"        data-domain="metro" style="--sw:#a855f7">地铁域</button>
  <button class="color-btn"        data-domain="rer"   style="--sw:#00a854">RER域</button>
  <span class="sep">│</span>
  <span>工具：</span>
  <button class="tool-btn active" data-tool="fill">🪣 油漆桶</button>
  <button class="tool-btn" data-tool="line">✏️ 闸机线</button>
  <button class="tool-btn" data-tool="pan">✋ 拖动</button>
  <span class="sep">│</span>
  <button id="undoBtn">↩ 撤销</button>
  <button id="resetBtn">重置</button>
  <button id="exportBtn">⬇ 导出数据</button>
  <span id="status"></span>
</div>
<div id="stage"><canvas id="view"></canvas></div>
<div id="hint">
  <b>流程</b>：先用「闸机线」在闸机/分界处画实线把区域封住 → 再用「油漆桶」点区域内部灌所选域的颜色（填充不会穿过实线，也不会越过墙）→
  滚轮缩放，「拖动」工具或按住 <b>空格</b> 平移，<b>Ctrl+Z</b> 撤销 → 全部标完点「导出数据」，把下载的 <b>domain-mask.json</b> 交给我。
</div>

const COLORS = {
  free:  { r: 245, g: 158, b: 11,  label: "免费域" },
  metro: { r: 168, g: 85,  b: 247, label: "地铁域" },
  rer:   { r: 0,   g: 168, b: 84,  label: "RER域"  }
};
const LINE_STYLE   = "rgba(15,15,25,0.95)";
const LINE_WIDTH   = 6;
const FILL_TOL2    = 68 * 68;      // RGB 欧氏距离平方容差
const MASK_ALPHA   = 0.42;
const UNDO_MAX     = 15;
const ZOOM_MIN_FIT = 0.6, ZOOM_MAX = 12;

let tool = "fill", domain = "free";
let W = 0, H = 0, base32 = null, line32 = null, lineDataDirty = true;
let scale = 1, ox = 0, oy = 0, fitScale = 1;
let lines = [];                    // 每条: {pts:[[x,y],[x,y]]} 图像坐标
const undoStack = [];
let spaceHeld = false, panning = false, panStart = null;
let drawingLine = false, lineStart = null, lineCur = null;

const stage  = document.getElementById("stage");
const view   = document.getElementById("view");
const statusEl = document.getElementById("status");
const vctx   = view.getContext("2d");
const mask   = document.createElement("canvas");
const lineC  = document.createElement("canvas");
const mctx   = mask.getContext("2d", { willReadFrequently: true });
const lctx   = lineC.getContext("2d", { willReadFrequently: true });
let maskData = null;

const img = new Image();
img.onload = init;
img.src = "data:image/jpeg;base64," + MAP_B64;

function init() {
  W = img.width; H = img.height;
  mask.width = lineC.width = W;
  mask.height = lineC.height = H;
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const octx = off.getContext("2d", { willReadFrequently: true });
  octx.drawImage(img, 0, 0);
  base32 = new Uint32Array(octx.getImageData(0, 0, W, H).data.buffer);
  maskData = mctx.getImageData(0, 0, W, H);
  fitView();
  updateStatus();
  redraw();
}

function fitView() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  fitScale = Math.min(sw / W, sh / H);
  scale = fitScale;
  ox = (sw - W * scale) / 2;
  oy = (sh - H * scale) / 2;
}

function redraw() {
  const dpr = window.devicePixelRatio || 1;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (view.width !== Math.round(sw * dpr) || view.height !== Math.round(sh * dpr)) {
    view.width = Math.round(sw * dpr); view.height = Math.round(sh * dpr);
    view.style.width = sw + "px"; view.style.height = sh + "px";
  }
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.fillStyle = "#101216";
  vctx.fillRect(0, 0, view.width, view.height);
  vctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  vctx.imageSmoothingEnabled = scale < 2;
  vctx.drawImage(img, 0, 0);
  vctx.globalAlpha = MASK_ALPHA;
  vctx.drawImage(mask, 0, 0);
  vctx.globalAlpha = 1;
  vctx.drawImage(lineC, 0, 0);
  if (drawingLine && lineStart && lineCur) {
    vctx.strokeStyle = "rgba(255,80,80,0.9)";
    vctx.lineWidth = LINE_WIDTH / scale;
    vctx.lineCap = "round";
    vctx.beginPath();
    vctx.moveTo(lineStart[0], lineStart[1]);
    vctx.lineTo(lineCur[0], lineCur[1]);
    vctx.stroke();
  }
}

function toImg(e) {
  const r = view.getBoundingClientRect();
  return [(e.clientX - r.left - ox) / scale, (e.clientY - r.top - oy) / scale];
}

/* ---------- 撤销 ---------- */
function pushUndo() {
  undoStack.push({
    mask: mctx.getImageData(0, 0, W, H),
    lines: JSON.parse(JSON.stringify(lines))
  });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
}

function undo() {
  const s = undoStack.pop();
  if (!s) { setStatus("没有可撤销的操作"); return; }
  mctx.putImageData(s.mask, 0, 0);
  maskData = mctx.getImageData(0, 0, W, H);
  lines = s.lines;
  repaintLines();
  redraw();
  updateStatus();
}

function repaintLines() {
  lctx.clearRect(0, 0, W, H);
  for (const L of lines) strokeSeg(L.pts[0], L.pts[1]);
  lineDataDirty = true;
}

function strokeSeg(a, b) {
  lctx.strokeStyle = LINE_STYLE;
  lctx.lineWidth = LINE_WIDTH;
  lctx.lineCap = "round";
  lctx.beginPath();
  lctx.moveTo(a[0], a[1]);
  lctx.lineTo(b[0], b[1]);
  lctx.stroke();
  lineDataDirty = true;
}

/* ---------- 油漆桶 ---------- */
function lineData() {
  if (lineDataDirty) {
    line32 = new Uint32Array(lctx.getImageData(0, 0, W, H).data.buffer);
    lineDataDirty = false;
  }
  return line32;
}

function doFill(sx, sy) {
  sx |= 0; sy |= 0;
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
  const idx = sy * W + sx;
  const c = COLORS[domain];
  const col = ((255 << 24) | (c.b << 16) | (c.g << 8) | c.r) >>> 0;  // little-endian ABGR（>>>0 转无符号）
  const l32 = lineData();
  const m32 = new Uint32Array(maskData.data.buffer);
  if ((l32[idx] >>> 24) > 40) { setStatus("起点在闸机线上，往旁边点一点"); return; }
  if (m32[idx] !== 0 && m32[idx] !== col) { setStatus("起点已是别的域的颜色（撤销后重试）"); return; }

  const seed = base32[idx];
  const sr = seed & 0xff, sg = (seed >>> 8) & 0xff, sb = (seed >>> 16) & 0xff;

  const visited = new Uint8Array(W * H);
  const stack = new Int32Array(W * H);
  let sp = 0;
  stack[sp++] = idx;
  visited[idx] = 1;
  let painted = 0;
  while (sp > 0) {
    const i = stack[--sp];
    m32[i] = col;
    painted++;
    const x = i % W, y = (i / W) | 0;
    // 4 邻域
    if (x > 0)     tryVisit(i - 1);
    if (x < W - 1) tryVisit(i + 1);
    if (y > 0)     tryVisit(i - W);
    if (y < H - 1) tryVisit(i + W);
    function tryVisit(j) {
      if (visited[j]) return;
      if ((l32[j] >>> 24) > 40) return;                 // 闸机线阻挡
      const m = m32[j];
      if (m !== 0 && m !== col) return;                 // 其他域阻挡
      const b = base32[j];
      const dr = (b & 0xff) - sr, dg = ((b >>> 8) & 0xff) - sg, db = ((b >>> 16) & 0xff) - sb;
      if (dr * dr + dg * dg + db * db > FILL_TOL2) return;  // 颜色容差（墙/文字/商店挡住）
      visited[j] = 1;
      stack[sp++] = j;
    }
  }
  mctx.putImageData(maskData, 0, 0);
  setStatus(domain + " 填充 " + painted.toLocaleString() + " px");
  updateStatus();
}

/* ---------- 事件 ---------- */
document.querySelectorAll(".color-btn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".color-btn").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  domain = b.dataset.domain;
  updateStatus();
}));
document.querySelectorAll(".tool-btn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tool-btn").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  tool = b.dataset.tool;
  view.style.cursor = tool === "pan" ? "grab" : "crosshair";
  updateStatus();
}));

view.addEventListener("pointerdown", e => {
  view.setPointerCapture(e.pointerId);
  const p = toImg(e);
  if (tool === "fill" && e.button === 0 && !spaceHeld) {
    pushUndo();
    doFill(p[0], p[1]);
  } else if (tool === "line" && e.button === 0 && !spaceHeld) {
    pushUndo();
    drawingLine = true;
    lineStart = p;
    lineCur = p;
  } else if (tool === "pan" || spaceHeld || e.button === 1 || e.button === 2) {
    panning = true;
    panStart = [e.clientX - ox, e.clientY - oy];
    view.style.cursor = "grabbing";
  }
});
view.addEventListener("pointermove", e => {
  if (drawingLine) { lineCur = toImg(e); redraw(); }
  else if (panning) { ox = e.clientX - panStart[0]; oy = e.clientY - panStart[1]; redraw(); }
});
view.addEventListener("pointerup", e => {
  if (drawingLine) {
    const p = toImg(e);
    const dx = p[0] - lineStart[0], dy = p[1] - lineStart[1];
    if (dx * dx + dy * dy > 4) {
      const seg = { pts: [lineStart.map(v => Math.round(v)), p.map(v => Math.round(v))] };
      lines.push(seg);
      strokeSeg(seg.pts[0], seg.pts[1]);
    } else {
      undoStack.pop();   // 无效点击，退回快照
    }
    drawingLine = false; lineStart = lineCur = null;
    redraw(); updateStatus();
  }
  panning = false;
  view.style.cursor = tool === "pan" ? "grab" : "crosshair";
});
view.addEventListener("contextmenu", e => e.preventDefault());

view.addEventListener("wheel", e => {
  e.preventDefault();
  const r = view.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0015);
  const ns = Math.min(ZOOM_MAX, Math.max(fitScale * ZOOM_MIN_FIT, scale * k));
  ox = mx - (mx - ox) * (ns / scale);
  oy = my - (my - oy) * (ns / scale);
  scale = ns;
  redraw();
}, { passive: false });

window.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
  else if (e.key === " " && !spaceHeld) { spaceHeld = true; view.style.cursor = "grab"; e.preventDefault(); }
});
window.addEventListener("keyup", e => {
  if (e.key === " ") { spaceHeld = false; view.style.cursor = tool === "pan" ? "grab" : "crosshair"; }
});
window.addEventListener("resize", redraw);

document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("resetBtn").addEventListener("click", () => {
  pushUndo();
  mctx.clearRect(0, 0, W, H);
  maskData = mctx.getImageData(0, 0, W, H);
  lines = [];
  repaintLines();
  redraw();
  setStatus("已清空（可撤销）");
  updateStatus();
});
document.getElementById("exportBtn").addEventListener("click", () => {
  const payload = {
    version: 1,
    image: "assets/img/map-base.jpg",
    width: W, height: H,
    maskPNG: mask.toDataURL("image/png"),
    lines: lines
  };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "domain-mask.json";
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus("已导出 domain-mask.json → 下载目录，把这个文件交给 Claude");
});

function setStatus(msg) { statusEl.textContent = msg; }
function updateStatus() {
  setStatus(COLORS[domain].label + " · " +
    { fill: "油漆桶", line: "闸机线", pan: "拖动" }[tool] +
    " · 线 " + lines.length + " · 撤销 " + undoStack.length + " · " + Math.round(scale * 100) + "%");
}
</script>
</body>
</html>
